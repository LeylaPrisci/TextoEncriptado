<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alura Challenge - Encriptador</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="Imagen/Vector.png" alt="logo Alura">
        </div>

        <main class="content">
            <section class="left-panel">
                <textarea id="introducirtexto" placeholder="Ingrese el texto aquí"></textarea>
                <div class="info-buttons">
                    <div class="info-text">
                        <img id="interrogacion" src="Imagen/Vector Interrogacion.png" alt="Signo Interrogacion">
                        <p>Solo letras minúsculas y sin acentos</p>
                    </div>
                    <div class="action-buttons">
                        <button type="button" id="encriptar">Encriptar</button>
                        <button type="button" id="desencriptar">Desencriptar</button>
                    </div>
                </div>
            </section>

            <section class="right-panel">
                <div id="no-message-found" class="message-placeholder">
                    <img id="imagen" src="Imagen/Muñeco.png" alt="Muñeco">
                    <h2 id="texto-placeholder">Ningún mensaje fue encontrado</h2>
                    <p id="subtexto-placeholder">Ingresa el texto que desees encriptar o desencriptar.</p>
                </div>
                <textarea id="texto2" class="output-textarea" readonly></textarea>
                <button type="button" id="copiar">Copiar</button>
            </section>
        </main>
    </div>
    
    <script src="Encriptado.js"></script>
</body>
</html>
